name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Test, lint, manifest validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Validate JSON files
        run: |
          for f in manifest.json package.json; do
            echo "Checking $f"
            node -e "JSON.parse(require('fs').readFileSync('$f', 'utf8'))" || exit 1
          done

      - name: Validate JavaScript syntax
        run: |
          for f in background.js content.js popup.js; do
            echo "Checking $f"
            node --check "$f"
          done
          for f in tests/*.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Verify manifest host permissions are valid
        run: |
          node -e "
            const m = require('./manifest.json');
            const required = ['manifest_version', 'name', 'version'];
            for (const k of required) {
              if (!(k in m)) { console.error('manifest missing ' + k); process.exit(1); }
            }
            if (m.manifest_version !== 3) { console.error('manifest_version must be 3'); process.exit(1); }
            if (!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(m.version)) { console.error('version must be semver'); process.exit(1); }
            if (Array.isArray(m.host_permissions)) {
              for (const p of m.host_permissions) {
                if (!/^https?:\/\/[a-z0-9.\-*]+(\/[^\s]*)?$/.test(p)) {
                  console.error('Invalid host permission: ' + p);
                  process.exit(1);
                }
              }
            }
            console.log('manifest OK (v' + m.version + ', ' + (m.host_permissions?.length ?? 0) + ' host permissions)');
          "
