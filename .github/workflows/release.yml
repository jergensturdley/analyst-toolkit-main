name: Release

# Store pipeline: tag push (or manual dispatch) → test → package both
# targets → addons-linter → upload Chrome zip to the Web Store STAGED
# (never auto-published) → attach zip + xpi to a GitHub Release.
# AMO submission stays manual.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        id: version
        run: |
          MANIFEST="$(node -p "require('./manifest.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "tag v$TAG != manifest $MANIFEST" >&2
            exit 1
          fi
          echo "version=$MANIFEST" >> "$GITHUB_OUTPUT"

      - name: Package Chrome and Firefox builds
        run: |
          bash scripts/build-store-package.sh
          bash scripts/build-store-package.sh firefox

      - name: Lint Firefox package with addons-linter
        run: npx --yes addons-linter@latest dist/staging-firefox --output text

      - name: Upload Chrome zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-zip
          path: dist/soc-analyst-toolkit-*.zip
          if-no-files-found: error

      - name: Upload Firefox xpi artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox-xpi
          path: dist/soc-analyst-toolkit-firefox-*.xpi
          if-no-files-found: error

  publish:
    name: Stage Chrome upload, attach release artifacts
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Detect Chrome Web Store secrets
        id: secrets
        env:
          HAS_CWS: ${{ secrets.CWS_REFRESH_TOKEN != '' && secrets.CWS_CLIENT_ID != '' && secrets.CWS_CLIENT_SECRET != '' && secrets.CWS_EXTENSION_ID != '' }}
        run: echo "cws=$HAS_CWS" >> "$GITHUB_OUTPUT"

      - name: Upload Chrome zip to Web Store (staged)
        if: steps.secrets.outputs.cws == 'true'
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          npx --yes chrome-webstore-upload-cli@3 upload \
            --source "dist/soc-analyst-toolkit-${{ needs.package.outputs.version }}.zip" \
            --extension-id "$EXTENSION_ID" \
            --client-id "$CLIENT_ID" \
            --client-secret "$CLIENT_SECRET" \
            --refresh-token "$REFRESH_TOKEN"
          echo "Uploaded to Chrome Web Store as a staged draft. Publish from the dashboard."

      - name: Attach packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/soc-analyst-toolkit-*.zip
            dist/soc-analyst-toolkit-firefox-*.xpi
          generate_release_notes: true
